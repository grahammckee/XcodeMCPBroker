name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

  package-runtime:
    name: Package runtime (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          npm run build:bundle
          if test "$ARCH" = arm64; then
            npm run build:sea
            RUNTIME=(dist/xcode-mcp-broker)
            codesign --force --sign - "${RUNTIME[0]}"
          else
            RUNTIME=("$(command -v node)" dist/xcode-mcp-broker.bundle.mjs)
          fi
          test "$("${RUNTIME[@]}" --version)" = "$(node -p 'require("./package.json").version')"
          XCODE_MCP_BROKER_PORT=17341 "${RUNTIME[@]}" > "$RUNNER_TEMP/broker.log" 2>&1 &
          BROKER_PID=$!
          trap 'kill "$BROKER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:17341/healthz || true)
            if test "$STATUS" = 200 || test "$STATUS" = 503; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/broker.log"
          exit 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
